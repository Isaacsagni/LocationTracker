<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Changed | Location Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      .card {
        width: 100%;
        max-width: 430px;
        margin: 20px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .icon {
        font-size: 55px;
        margin-bottom: 15px;
      }

      h1 {
        margin: 0 0 15px;
        font-size: 25px;
      }

      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
      }

      .success {
        margin-top: 20px;
        padding: 15px;
        background: #dcfce7;
        border-radius: 10px;
        color: #166534;
        font-size: 14px;
        line-height: 1.6;
      }

      .login-button {
        display: inline-block;
        margin-top: 25px;
        padding: 13px 25px;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
      }

      .login-button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icon">✅</div>

      <h1>Password Changed</h1>

      <p>Your password has been successfully changed.</p>

      <div class="success">You can now log in using your new password.</div>

      <a href="{% url 'login' %}" class="login-button"> 🔓 Log In </a>
    </div>
  </body>
</html>
