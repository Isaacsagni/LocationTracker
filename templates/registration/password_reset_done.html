<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Check Your Email | Location Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      .card {
        width: 100%;
        max-width: 430px;
        margin: 20px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .icon {
        font-size: 50px;
        margin-bottom: 15px;
      }

      h1 {
        margin: 0 0 15px;
        font-size: 25px;
      }

      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
      }

      .notice {
        margin-top: 20px;
        padding: 15px;
        background: #eff6ff;
        border-radius: 10px;
        color: #1e40af;
        font-size: 14px;
        line-height: 1.6;
      }

      .back {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 20px;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }

      .back:hover {
        background: #1d4ed8;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icon">📧</div>

      <h1>Check Your Email</h1>

      <p>
        If an account exists with the email address you entered, a password
        reset link has been sent.
      </p>

      <div class="notice">
        Check your inbox and follow the link in the email to create your new
        password.

        <br /><br />

        If you don't see the email, check your spam or junk folder.
      </div>

      <a href="{% url 'login' %}" class="back"> ← Back to Login </a>
    </div>
  </body>
</html>
