<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | Location Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      .card {
        width: 100%;
        max-width: 430px;
        margin: 20px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      .icon {
        text-align: center;
        font-size: 42px;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: 25px;
      }

      .description {
        margin: 12px 0 25px;
        text-align: center;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 13px;
        margin-bottom: 18px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #2563eb;
      }

      .button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      .button:hover {
        background: #1d4ed8;
      }

      .back {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
      }

      .back:hover {
        text-decoration: underline;
      }

      .error {
        margin-bottom: 18px;
        padding: 12px;
        border-radius: 8px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icon">🔑</div>

      <h1>Reset Your Password</h1>

      <div class="description">
        Enter the email address associated with your account. We will send you a
        password reset link.
      </div>

      {% if form.errors %}

      <div class="error">Please enter a valid email address.</div>

      {% endif %}

      <form method="post">
        {% csrf_token %}

        <label for="id_email"> Email Address </label>

        {{ form.email }}

        <button type="submit" class="button">📧 Send Reset Link</button>
      </form>

      <a href="{% url 'login' %}" class="back"> ← Back to Login </a>
    </div>
  </body>
</html>
