<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Login</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: Arial, sans-serif;

        background: #f1f5f9;
      }

      .login-container {
        width: 90%;

        max-width: 420px;

        background: white;

        padding: 40px;

        border-radius: 16px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;

        margin: 0 0 10px;

        font-size: 28px;
      }

      .subtitle {
        text-align: center;

        color: #64748b;

        margin-bottom: 30px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        font-weight: bold;
      }

      input {
        width: 100%;

        padding: 13px;

        border: 1px solid #cbd5e1;

        border-radius: 8px;

        font-size: 16px;

        margin-bottom: 20px;
      }

      input:focus {
        outline: none;

        border-color: #2563eb;
      }

      button {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 8px;

        background: #2563eb;

        color: white;

        font-size: 16px;

        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .error {
        background: #fee2e2;

        color: #991b1b;

        padding: 12px;

        border-radius: 8px;

        margin-bottom: 20px;

        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h1>🔐 Dashboard Login</h1>

      <p class="subtitle">Authorized access only</p>

      {% if form.errors %}

      <div class="error">Incorrect username or password.</div>

      {% endif %}

      <form method="post">
        {% csrf_token %}

        <label for="id_username"> Username </label>

        <input
          type="text"
          name="username"
          id="id_username"
          required
          autofocus
        />

        <label for="id_password"> Password </label>

        <input type="password" name="password" id="id_password" required />

        <button type="submit">Sign In</button>
      </form>
    </div>
  </body>
</html>
